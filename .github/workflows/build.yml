name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write  # gh release create

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - run: ./build.ps1
      - run: ctest --test-dir build/Release --output-on-failure
      - uses: actions/upload-artifact@v7
        with:
          name: WinPager
          path: build/Release/WinPager.exe
      # To release: bump the version in CMakeLists.txt, res/app.rc and res/app.manifest, then push a vX.Y.Z tag.
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v = $env:GITHUB_REF_NAME.Substring(1)
          if ((Get-Item build/Release/WinPager.exe).VersionInfo.ProductVersion -ne $v -or -not (Select-String -Quiet -SimpleMatch "VERSION $v " CMakeLists.txt)) {
            throw "$env:GITHUB_REF_NAME doesn't match the version in CMakeLists.txt and res/app.rc"
          }
          gh release create $env:GITHUB_REF_NAME build/Release/WinPager.exe --title "WinPager $v" --generate-notes
