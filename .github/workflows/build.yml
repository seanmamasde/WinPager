name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write  # gh release create

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - run: ./build.ps1
      - run: ctest --test-dir build/Release --output-on-failure
      # Windhawk 1.7.3, installed portable as windhawk-mods' CI does it, for its compiler
      - name: Windhawk mod
        run: |
          $setup = "$env:RUNNER_TEMP\windhawk_setup.exe"
          Invoke-WebRequest https://github.com/ramensoftware/windhawk/releases/download/v1.7.3/windhawk_setup.exe -OutFile $setup
          if ((Get-FileHash $setup).Hash -ne '5116CC1703384AAC88B8D7A3B57F172AEA5DA32B6DF7355FB2F8247D23813C8F') { throw 'unexpected windhawk_setup.exe' }
          (Start-Process $setup '/S', '/PORTABLE', "/D=$env:RUNNER_TEMP\windhawk" -PassThru).WaitForExit()
          ./build.ps1 Windhawk -Windhawk "$env:RUNNER_TEMP\windhawk"
      - uses: actions/upload-artifact@v7
        with:
          name: WinPager
          path: |
            build/Release/WinPager.exe
            build/windhawk/winpager.wh.cpp
      # To release: bump the version in CMakeLists.txt, res/app.rc and res/app.manifest, then push a vX.Y.Z tag.
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v = $env:GITHUB_REF_NAME.Substring(1)
          if ((Get-Item build/Release/WinPager.exe).VersionInfo.ProductVersion -ne $v -or -not (Select-String -Quiet -SimpleMatch "VERSION $v " CMakeLists.txt)) {
            throw "$env:GITHUB_REF_NAME doesn't match the version in CMakeLists.txt and res/app.rc"
          }
          gh release create $env:GITHUB_REF_NAME build/Release/WinPager.exe build/windhawk/winpager.wh.cpp --title "WinPager $v" --generate-notes
