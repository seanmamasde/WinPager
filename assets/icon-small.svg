<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16">
  <!-- pixel-snapped variant for 16-24 px -->
  <defs>
    <linearGradient id="back" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7EE3FF"/>
      <stop offset="1" stop-color="#38B0F0"/>
    </linearGradient>
    <linearGradient id="front" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3FBDF5"/>
      <stop offset="1" stop-color="#155FD8"/>
    </linearGradient>
  </defs>
  <rect x="5" y="1" width="10" height="10" rx="2" fill="url(#back)"/>
  <rect x="1" y="5" width="10" height="10" rx="2" fill="url(#front)" fill-opacity="0.95"/>
  <rect x="3" y="8" width="6" height="5" rx="0.75" fill="#FFFFFF" fill-opacity="0.3"/>
  <rect x="3" y="8" width="6" height="1.5" fill="#FFFFFF" fill-opacity="0.95"/>
</svg>
